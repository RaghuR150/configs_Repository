spring.application.name=payment-service-micro

spring.datasource.url=jdbc:mysql://localhost:3306/springbootdatabase
spring.datasource.username=root
spring.datasource.password=root1999
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.zipkin.base-url=http://localhost:9411
spring.zipkin.enabled=true

server.port=8082

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

management.tracing.sampling.probability=1.0

management.observations.enable.http.server.requests=true
management.observations.enable.http.client.requests=true

management.endpoints.web.exposure.include=*

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %5p [${spring.application.name},%X{trace_id},%X{span_id}] %logger{36} - %msg%n
