# ===============================
# APPLICATION IDENTIFICATION
# ===============================

# Logical name of the microservice (used by Eureka, Zipkin, logs, etc.)
spring.application.name=payment-service-micro


# ===============================
# DATABASE CONFIGURATION (MySQL)
# ===============================

# JDBC URL of the MySQL database (host:port/databaseName)
spring.datasource.url=jdbc:mysql://localhost:3306/springbootdatabase

# MySQL database username
spring.datasource.username=root

# MySQL database password
spring.datasource.password=root1999

# MySQL JDBC driver class
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / HIBERNATE SETTINGS
# ===============================

# Automatically updates the database schema based on entity classes (safe for development)
spring.jpa.hibernate.ddl-auto=update

# Displays SQL queries in the console (useful for debugging)
spring.jpa.show-sql=true


# ===============================
# ZIPKIN DISTRIBUTED TRACING
# ===============================

# Base URL where Zipkin server is running
spring.zipkin.base-url=http://localhost:9411

# Enables Zipkin tracing
spring.zipkin.enabled=true


# ===============================
# SERVER CONFIGURATION
# ===============================

# Port on which the payment service will run
server.port=8082


# ===============================
# EUREKA SERVICE DISCOVERY
# ===============================

# URL of the Eureka server (service registry)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Register this service with Eureka server
eureka.client.register-with-eureka=true

# Fetch registry information from Eureka (required for inter-service calls)
eureka.client.fetch-registry=true


# ===============================
# MICROMETER TRACING CONFIG
# ===============================

# Sampling probability for tracing (1.0 = trace 100% of requests, best for learning/debugging)
management.tracing.sampling.probability=1.0


# ===============================
# MICROMETER OBSERVATIONS (METRICS + TRACING)
# ===============================

# Enable observation of incoming HTTP server requests
management.observations.enable.http.server.requests=true

# Enable observation of outgoing HTTP client requests (Feign, RestTemplate, WebClient)
management.observations.enable.http.client.requests=true


# ===============================
# ACTUATOR ENDPOINTS EXPOSURE
# ===============================

# Expose all actuator endpoints (good for dev, NOT recommended for production)
management.endpoints.web.exposure.include=*


# ===============================
# LOGGING CONFIGURATION (TRACE-AWARE LOGS)
# ===============================

# Custom log pattern including:
# - Timestamp
# - Thread name
# - Log level
# - Application name
# - Trace ID (from Zipkin)
# - Span ID (from Zipkin)
# - Logger name
# - Log message
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %5p [${spring.application.name},%X{trace_id},%X{span_id}] %logger{36} - %msg%n
