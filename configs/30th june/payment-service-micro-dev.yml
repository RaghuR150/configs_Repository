spring:
  application:
    name: payment-service-micro

  datasource:
    url: jdbc:mysql://localhost:3306/springbootdatabase
    username: root
    password: root1999
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  zipkin:
    base-url: http://localhost:9411
    enabled: true

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

management:
  tracing:
    sampling:
      probability: 1.0

  observations:
    enable:
      http:
        server:
          requests: true
        client:
          requests: true

  endpoints:
    web:
      exposure:
        include: "*"

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %5p [${spring.application.name},%X{trace_id},%X{span_id}] %logger{36} - %msg%n"
