# ===============================
# APPLICATION IDENTIFICATION
# ===============================

# Logical name of the microservice (used by Eureka, Feign, Zipkin, Logs)
spring.application.name=order-service-micro


# ===============================
# FEIGN + MICROMETER INTEGRATION
# ===============================

# Enables Micrometer metrics & tracing for Feign client calls
spring.cloud.openfeign.micrometer.enabled=true


# ===============================
# DATABASE CONFIGURATION (MySQL)
# ===============================

# JDBC URL of the MySQL database
spring.datasource.url=jdbc:mysql://localhost:3306/springbootdatabase

# MySQL username
spring.datasource.username=root

# MySQL password
spring.datasource.password=root1999

# MySQL JDBC Driver class
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / HIBERNATE SETTINGS
# ===============================

# Automatically updates DB schema based on entity classes (safe for dev)
spring.jpa.hibernate.ddl-auto=update

# Shows SQL queries in console (very useful for debugging)
spring.jpa.show-sql=true


# ===============================
# ZIPKIN DISTRIBUTED TRACING
# ===============================

# Zipkin server base URL (where traces will be sent)
spring.zipkin.base-url=http://localhost:9411

# Enables Zipkin tracing
spring.zipkin.enabled=true


# ===============================
# SERVER CONFIGURATION
# ===============================

# Port on which this microservice will run
server.port=8081


# ===============================
# EUREKA SERVICE DISCOVERY
# ===============================

# URL of the Eureka server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Register this service with Eureka
eureka.client.register-with-eureka=true

# Fetch registry information from Eureka (needed for Feign + load balancing)
eureka.client.fetch-registry=true


# ===============================
# MICROMETER TRACING CONFIG
# ===============================

# Sampling probability for tracing (1.0 = trace 100% of requests)
management.tracing.sampling.probability=1.0


# ===============================
# MICROMETER OBSERVATIONS (METRICS + TRACING)
# ===============================

# Enable observation of incoming HTTP server requests
management.observations.enable.http.server.requests=true

# Enable observation of outgoing HTTP client requests (Feign, RestTemplate)
management.observations.enable.http.client.requests=true


# ===============================
# ACTUATOR ENDPOINTS EXPOSURE
# ===============================

# Expose all actuator endpoints (for dev only, not recommended in prod)
management.endpoints.web.exposure.include=*


# ===============================
# LOGGING CONFIGURATION (TRACE-AWARE LOGS)
# ===============================

# Custom log pattern including:
# - Timestamp
# - Thread name
# - Log level
# - Application name
# - Trace ID (for Zipkin)
# - Span ID (for Zipkin)
# - Logger name
# - Log message
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %5p [${spring.application.name},%X{trace_id},%X{span_id}] %logger{36} - %msg%n
