# =========================================================
# SERVER CONFIGURATION
# =========================================================

# Port on which the Review Service will run
server.port=8088


# =========================================================
# DATABASE CONFIGURATION (MySQL)
# =========================================================

# JDBC URL for the Review Service database
# Format: jdbc:mysql://<host>:<port>/<database-name>
spring.datasource.url=jdbc:mysql://localhost:3306/review_db

# Database username
spring.datasource.username=root

# Database password
spring.datasource.password=root1999


# =========================================================
# JPA / HIBERNATE CONFIGURATION
# =========================================================

# Controls how Hibernate handles database schema generation
# update = updates schema without dropping existing data
spring.jpa.hibernate.ddl-auto=update

# Enables logging of generated SQL queries
spring.jpa.show-sql=true

# Formats SQL output for better readability in logs
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# EUREKA CLIENT CONFIGURATION (SERVICE DISCOVERY)
# =========================================================

# Eureka Server URL where this service will register itself
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Registers Review Service with Eureka Server
eureka.client.register-with-eureka=true

# Fetches registry details of other services from Eureka
eureka.client.fetch-registry=true


# =========================================================
# SPRING BOOT ACTUATOR CONFIGURATION
# =========================================================

# Exposes all actuator endpoints (health, metrics, env, etc.)
# WARNING: Restrict in production for security
management.endpoints.web.exposure.include=*


# =========================================================
# OPENFEIGN + MICROMETER INTEGRATION
# =========================================================

# Enables Micrometer metrics and tracing for Feign client calls
spring.cloud.openfeign.micrometer.enabled=true


# =========================================================
# ZIPKIN DISTRIBUTED TRACING CONFIGURATION
# =========================================================

# Base URL of Zipkin server to which tracing data is sent
spring.zipkin.base-url=http://localhost:9411

# Enables Zipkin distributed tracing
spring.zipkin.enabled=true


# =========================================================
# MICROMETER TRACING CONFIGURATION
# =========================================================

# Probability of tracing requests
# 1.0 = trace every request (recommended only for development)
management.tracing.sampling.probability=1.0


# =========================================================
# MICROMETER OBSERVATIONS (METRICS + TRACING)
# =========================================================

# Enables observation of incoming HTTP server requests
management.observations.enable.http.server.requests=true

# Enables observation of outgoing HTTP client calls
# (Feign, RestTemplate, WebClient)
management.observations.enable.http.client.requests=true


# =========================================================
# LOGGING CONFIGURATION (TRACE-AWARE LOGS)
# =========================================================

# Custom console log format including:
# - Timestamp
# - Thread name
# - Log level
# - Trace ID (Zipkin)
# - Span ID (Zipkin)
# - Logger name
# - Actual log message
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n
