# =========================================================
# SERVER CONFIGURATION
# =========================================================

# Port on which the Inventory Service will run
server.port=8083


# =========================================================
# DATABASE CONFIGURATION (MySQL)
# =========================================================

# JDBC URL for the Inventory Service database
# Format: jdbc:mysql://<host>:<port>/<database-name>
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_db

# Database username
spring.datasource.username=root

# Database password
spring.datasource.password=root1999


# =========================================================
# JPA / HIBERNATE CONFIGURATION
# =========================================================

# Controls how Hibernate manages the database schema
# update = updates schema without deleting existing data
spring.jpa.hibernate.ddl-auto=update

# Enables logging of generated SQL queries
spring.jpa.show-sql=true

# Formats SQL queries for better readability in logs
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# EUREKA CLIENT CONFIGURATION (SERVICE DISCOVERY)
# =========================================================

# URL of Eureka Server where Inventory Service registers itself
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Enables registration of this service with Eureka
eureka.client.register-with-eureka=true

# Enables fetching of other registered services from Eureka
eureka.client.fetch-registry=true


# =========================================================
# RESILIENCE4J CIRCUIT BREAKER CONFIGURATION
# =========================================================

# Enables health indicator for the inventoryService circuit breaker
# Allows monitoring circuit state via Actuator
resilience4j.circuitbreaker.instances.inventoryService.register-health-indicator=true

# Number of calls recorded in the sliding window
resilience4j.circuitbreaker.instances.inventoryService.sliding-window-size=10

# Minimum number of calls required before failure rate is calculated
resilience4j.circuitbreaker.instances.inventoryService.minimum-number-of-calls=5

# Failure rate threshold (percentage) to open the circuit breaker
resilience4j.circuitbreaker.instances.inventoryService.failure-rate-threshold=50

# Time the circuit breaker stays OPEN before transitioning to HALF-OPEN
resilience4j.circuitbreaker.instances.inventoryService.wait-duration-in-open-state=10s


# =========================================================
# SPRING BOOT ACTUATOR CONFIGURATION
# =========================================================

# Exposes all Actuator endpoints (health, metrics, circuitbreakers, etc.)
# NOTE: Restrict in production for security
management.endpoints.web.exposure.include=*


# =========================================================
# OPENFEIGN + MICROMETER INTEGRATION
# =========================================================

# Enables Micrometer metrics and distributed tracing for Feign client calls
spring.cloud.openfeign.micrometer.enabled=true


# =========================================================
# ZIPKIN DISTRIBUTED TRACING CONFIGURATION
# =========================================================

# Base URL of Zipkin server where distributed traces are sent
spring.zipkin.base-url=http://localhost:9411

# Enables Zipkin distributed tracing
spring.zipkin.enabled=true


# =========================================================
# MICROMETER TRACING CONFIGURATION
# =========================================================

# Sampling rate for distributed tracing
# 1.0 = trace 100% of requests (recommended only for development)
management.tracing.sampling.probability=1.0


# =========================================================
# MICROMETER OBSERVATIONS (METRICS + TRACING)
# =========================================================

# Enables observation of incoming HTTP server requests
management.observations.enable.http.server.requests=true

# Enables observation of outgoing HTTP client requests
# (Feign, RestTemplate, WebClient)
management.observations.enable.http.client.requests=true


# =========================================================
# LOGGING CONFIGURATION (TRACE-AWARE LOGGING)
# =========================================================

# Custom console log format including:
# - Timestamp
# - Thread name
# - Log level
# - Trace ID (Zipkin)
# - Span ID (Zipkin)
# - Logger name
# - Log message
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n
