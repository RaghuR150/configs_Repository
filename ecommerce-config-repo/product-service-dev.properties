# =========================================================
# SERVER CONFIGURATION
# =========================================================

# Port on which the Product Service will run
server.port=8082


# =========================================================
# DATABASE CONFIGURATION (DEVELOPMENT ENVIRONMENT)
# =========================================================

# JDBC URL for MySQL database used by Product Service
# Format: jdbc:mysql://<host>:<port>/<database-name>
spring.datasource.url=jdbc:mysql://localhost:3306/product_db

# Database username
spring.datasource.username=root

# Database password
spring.datasource.password=root1999


# =========================================================
# JPA / HIBERNATE CONFIGURATION
# =========================================================

# Defines how Hibernate manages the database schema
# update = modifies schema without dropping existing data
spring.jpa.hibernate.ddl-auto=update

# Enables logging of generated SQL queries
spring.jpa.show-sql=true

# Formats SQL queries to improve readability in logs
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# EUREKA CLIENT CONFIGURATION (SERVICE DISCOVERY)
# =========================================================

# URL of the Eureka Server where Product Service registers itself
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Enables registration of this service with Eureka
eureka.client.register-with-eureka=true

# Allows this service to fetch details of other services from Eureka
eureka.client.fetch-registry=true


# =========================================================
# SPRING BOOT ACTUATOR CONFIGURATION
# =========================================================

# Exposes all Actuator endpoints (health, metrics, info, etc.)
# NOTE: Restrict access in production environments
management.endpoints.web.exposure.include=*


# =========================================================
# OPENFEIGN + MICROMETER INTEGRATION
# =========================================================

# Enables Micrometer metrics and distributed tracing for Feign client calls
spring.cloud.openfeign.micrometer.enabled=true


# =========================================================
# ZIPKIN DISTRIBUTED TRACING CONFIGURATION
# =========================================================

# Base URL of the Zipkin server where tracing data is sent
spring.zipkin.base-url=http://localhost:9411

# Enables Zipkin distributed tracing support
spring.zipkin.enabled=true


# =========================================================
# MICROMETER TRACING CONFIGURATION
# =========================================================

# Sampling rate for tracing
# 1.0 = trace every request (recommended only for development)
management.tracing.sampling.probability=1.0


# =========================================================
# MICROMETER OBSERVATIONS (METRICS + TRACING)
# =========================================================

# Enables observation of incoming HTTP server requests
management.observations.enable.http.server.requests=true

# Enables observation of outgoing HTTP client requests
# (Feign, RestTemplate, WebClient)
management.observations.enable.http.client.requests=true


# =========================================================
# LOGGING CONFIGURATION (TRACE-AWARE LOGGING)
# =========================================================

# Custom console log format including:
# - Timestamp
# - Thread name
# - Log level
# - Trace ID (Zipkin)
# - Span ID (Zipkin)
# - Logger name
# - Log message
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n
