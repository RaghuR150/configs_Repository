# =========================================================
# SERVER CONFIGURATION
# =========================================================

# Port on which the Payment Service will run
server.port=8085


# =========================================================
# DATABASE CONFIGURATION (MySQL)
# =========================================================

# JDBC URL for the Payment Service database
# Format: jdbc:mysql://<host>:<port>/<database-name>
spring.datasource.url=jdbc:mysql://localhost:3306/payment_db

# Database username
spring.datasource.username=root

# Database password
spring.datasource.password=root1999


# =========================================================
# JPA / HIBERNATE CONFIGURATION
# =========================================================

# Controls how Hibernate manages the database schema
# update = updates schema without deleting existing data
spring.jpa.hibernate.ddl-auto=update

# Enables logging of generated SQL queries
spring.jpa.show-sql=true

# Formats SQL queries for better readability in logs
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# EUREKA CLIENT CONFIGURATION (SERVICE DISCOVERY)
# =========================================================

# URL of Eureka Server where Payment Service registers itself
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Enables registration of this service with Eureka
eureka.client.register-with-eureka=true

# Enables fetching of other registered services from Eureka
eureka.client.fetch-registry=true


# =========================================================
# KAFKA CONFIGURATION (EVENT-DRIVEN COMMUNICATION)
# =========================================================

# Kafka broker address used by producers and consumers
spring.kafka.bootstrap-servers=localhost:9092

# Consumer group ID for Payment Service
# Ensures load balancing and message processing coordination
spring.kafka.consumer.group-id=payment-group

# Defines behavior when no offset is found for the consumer group
# earliest = start consuming from the beginning of the topic
spring.kafka.consumer.auto-offset-reset=earliest

# Deserializer for Kafka message keys
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Deserializer for Kafka message values
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Serializer for Kafka producer message keys
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

# Serializer for Kafka producer message values
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer


# =========================================================
# SPRING BOOT ACTUATOR CONFIGURATION
# =========================================================

# Exposes all Actuator endpoints (health, metrics, info, etc.)
# WARNING: Restrict access in production
management.endpoints.web.exposure.include=*


# =========================================================
# OPENFEIGN + MICROMETER INTEGRATION
# =========================================================

# Enables Micrometer metrics and distributed tracing for Feign client calls
spring.cloud.openfeign.micrometer.enabled=true


# =========================================================
# ZIPKIN DISTRIBUTED TRACING CONFIGURATION
# =========================================================

# Base URL of Zipkin server where distributed traces are sent
spring.zipkin.base-url=http://localhost:9411

# Enables Zipkin distributed tracing
spring.zipkin.enabled=true


# =========================================================
# MICROMETER TRACING CONFIGURATION
# =========================================================

# Sampling rate for distributed tracing
# 1.0 = trace 100% of requests (recommended only for development)
management.tracing.sampling.probability=1.0


# =========================================================
# MICROMETER OBSERVATIONS (METRICS + TRACING)
# =========================================================

# Enables observation of incoming HTTP server requests
management.observations.enable.http.server.requests=true

# Enables observation of outgoing HTTP client requests
# (Feign, RestTemplate, WebClient)
management.observations.enable.http.client.requests=true


# =========================================================
# LOGGING CONFIGURATION (TRACE-AWARE LOGGING)
# =========================================================

# Custom console log pattern including:
# - Timestamp
# - Thread name
# - Log level
# - Trace ID (Zipkin)
# - Span ID (Zipkin)
# - Logger name
# - Log message
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n
