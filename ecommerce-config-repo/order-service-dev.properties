# ===============================
# Server
# ===============================
server.port=8084

# OpenFeign
# ===============================
spring.cloud.openfeign.enabled=true

# ===============================
# Database
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/order_db
spring.datasource.username=root
spring.datasource.password=root1999

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Eureka
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ===============================
# Kafka
# ===============================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=*


# Enables Micrometer metrics & tracing for Feign client calls
spring.cloud.openfeign.micrometer.enabled=true


# ===============================
# ZIPKIN DISTRIBUTED TRACING
# ===============================

# Zipkin server base URL (where traces will be sent)
spring.zipkin.base-url=http://localhost:9411

# Enables Zipkin tracing
spring.zipkin.enabled=true

# ===============================
# MICROMETER TRACING CONFIG
# ===============================

# Sampling probability for tracing (1.0 = trace 100% of requests)
management.tracing.sampling.probability=1.0

# ===============================
# MICROMETER OBSERVATIONS (METRICS + TRACING)
# ===============================

# Enable observation of incoming HTTP server requests
management.observations.enable.http.server.requests=true

# Enable observation of outgoing HTTP client requests (Feign, RestTemplate)
management.observations.enable.http.client.requests=true

# ===============================
# LOGGING CONFIGURATION (TRACE-AWARE LOGS)
# ===============================

# Custom log pattern including:
# - Timestamp
# - Thread name
# - Log level
# - Application name
# - Trace ID (for Zipkin)
# - Span ID (for Zipkin)
# - Logger name
# - Log message
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n
