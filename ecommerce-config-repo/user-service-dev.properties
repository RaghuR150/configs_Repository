# =========================================================
# SERVER CONFIGURATION
# =========================================================

# Port on which this microservice will run
server.port=8081


# =========================================================
# DATABASE CONFIGURATION (DEV ENVIRONMENT)
# =========================================================

# JDBC URL for MySQL database
# Format: jdbc:mysql://<host>:<port>/<database-name>
spring.datasource.url=jdbc:mysql://localhost:3306/user-service

# Database username
spring.datasource.username=root

# Database password
spring.datasource.password=root1999


# =========================================================
# JPA / HIBERNATE CONFIGURATION
# =========================================================

# Automatically updates database schema based on JPA entities
# Options: none | validate | update | create | create-drop
spring.jpa.hibernate.ddl-auto=update

# Enables logging of SQL queries in console
spring.jpa.show-sql=true

# Formats SQL queries to be more readable in logs
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# EUREKA CLIENT CONFIGURATION (SERVICE DISCOVERY)
# =========================================================

# URL of Eureka Server where this service will register
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Registers this microservice with Eureka Server
eureka.client.register-with-eureka=true

# Fetches registry information about other services from Eureka
eureka.client.fetch-registry=true


# =========================================================
# SPRING BOOT ACTUATOR CONFIGURATION
# =========================================================

# Exposes all actuator endpoints (health, metrics, info, etc.)
# NOTE: In production, restrict this for security reasons
management.endpoints.web.exposure.include=*


# =========================================================
# OPENFEIGN + MICROMETER INTEGRATION
# =========================================================

# Enables Micrometer metrics and tracing for Feign client calls
spring.cloud.openfeign.micrometer.enabled=true


# =========================================================
# ZIPKIN DISTRIBUTED TRACING CONFIGURATION
# =========================================================

# Base URL of Zipkin server where traces will be sent
spring.zipkin.base-url=http://localhost:9411

# Enables Zipkin tracing support
spring.zipkin.enabled=true


# =========================================================
# MICROMETER TRACING CONFIGURATION
# =========================================================

# Probability of tracing requests
# 1.0 = trace 100% of requests
# Recommended lower value in production (e.g., 0.1)
management.tracing.sampling.probability=1.0


# =========================================================
# MICROMETER OBSERVATIONS (METRICS + TRACING)
# =========================================================

# Enables observation of incoming HTTP server requests
management.observations.enable.http.server.requests=true

# Enables observation of outgoing HTTP client requests
# (Feign, RestTemplate, WebClient)
management.observations.enable.http.client.requests=true


# =========================================================
# LOGGING CONFIGURATION (TRACE-AWARE LOGS)
# =========================================================

# Custom console log pattern including:
# - Timestamp
# - Thread name
# - Log level
# - Trace ID (Zipkin)
# - Span ID (Zipkin)
# - Logger name
# - Log message
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n
