# ==============================
# SERVER CONFIG
# ==============================
server.port=8080

# ==============================
# EUREKA CLIENT CONFIG
# ==============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ==============================
# ENABLE AUTO DISCOVERY ROUTING
# (Allows /SERVICE-NAME/** routing)
# ==============================
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# ==============================
# MANUAL ROUTES
# ==============================

# ---------- USER SERVICE ----------
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/users,/users/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=0

# ---------- ORDER SERVICE ----------
spring.cloud.gateway.routes[1].id=order-service
spring.cloud.gateway.routes[1].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/orders,/orders/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=0

# ---------- CART SERVICE ----------
spring.cloud.gateway.routes[2].id=cart-service
spring.cloud.gateway.routes[2].uri=lb://CART-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/cart,/cart/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=0

# ---------- INVENTORY SERVICE ----------
spring.cloud.gateway.routes[3].id=inventory-service
spring.cloud.gateway.routes[3].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/inventory,/inventory/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=0

# ---------- PAYMENT SERVICE ----------
spring.cloud.gateway.routes[4].id=payment-service
spring.cloud.gateway.routes[4].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/payments,/payments/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=0

# ---------- REVIEW SERVICE ----------
spring.cloud.gateway.routes[5].id=review-service
spring.cloud.gateway.routes[5].uri=lb://REVIEW-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/reviews,/reviews/**
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=0

# ---------- PRODUCT SERVICE ----------
spring.cloud.gateway.routes[6].id=product-service
spring.cloud.gateway.routes[6].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/products,/products/**
spring.cloud.gateway.routes[6].filters[0]=StripPrefix=0

# ==============================
# ACTUATOR
# ==============================
management.endpoints.web.exposure.include=health,info,refresh
