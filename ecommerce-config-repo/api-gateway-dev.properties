# ==============================
# SERVER CONFIG
# ==============================
server.port=8080

# ==============================
# EUREKA CLIENT CONFIG
# ==============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ==============================
# ENABLE AUTO DISCOVERY ROUTES (NEW KEYS)
# ==============================
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# ==============================
# MANUAL ROUTES (WebFlux Gateway)
# ==============================

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=0

spring.cloud.gateway.server.webflux.routes[1].id=order-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/orders/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=0

spring.cloud.gateway.server.webflux.routes[2].id=cart-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://CART-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/cart/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=0

spring.cloud.gateway.server.webflux.routes[3].id=inventory-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/inventory/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=0

spring.cloud.gateway.server.webflux.routes[4].id=payment-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/payments/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=0

spring.cloud.gateway.server.webflux.routes[5].id=review-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://REVIEW-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/reviews/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=0

spring.cloud.gateway.server.webflux.routes[6].id=product-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/products/**
spring.cloud.gateway.server.webflux.routes[6].filters[0]=StripPrefix=0


# ==============================
# ACTUATOR
# ==============================
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,refresh,env
